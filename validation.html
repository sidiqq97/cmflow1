<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation des publications — CMFlow Client</title>
  <meta name="description" content="Espace client sécurisé pour la validation des publications réseaux sociaux.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="client-portal-layout">

  <!-- Topbar Client -->
  <header class="portal-topbar">
    <div class="portal-brand">
      <img src="images/logo.svg" alt="CMFlow" style="height: 28px; width: auto; display: block;">
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="portal-agency-badge" id="portal-agency-name">Géré par votre Community Manager</span>
    </div>
  </header>

  <!-- Hero Header -->
  <div class="portal-hero">
    <h1>Espace de Validation des Contenus</h1>
    <p>Consultez vos prochaines publications prévues, validez-les d'un clic ou indiquez vos ajustements à votre Community Manager.</p>
  </div>

  <!-- Summary Bar -->
  <div class="portal-summary-bar">
    <div class="portal-stats-row">
      <div class="portal-stat-item">
        <span class="portal-stat-num" id="portal-stat-total">0</span>
        <span class="portal-stat-lbl">Publications</span>
      </div>
      <div class="portal-stat-item">
        <span class="portal-stat-num" id="portal-stat-approved" style="color: #10B981;">0</span>
        <span class="portal-stat-lbl">Validées</span>
      </div>
      <div class="portal-stat-item">
        <span class="portal-stat-num" id="portal-stat-pending" style="color: #F59E0B;">0</span>
        <span class="portal-stat-lbl">En attente</span>
      </div>
    </div>

    <div style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">
      Client : <strong id="portal-client-title" style="color: var(--text-main);">Tous les comptes</strong>
    </div>
  </div>

  <!-- Posts Container -->
  <main class="portal-posts-container" id="portal-posts-list">
    <!-- Rendu dynamique des cartes de post -->
  </main>

  <!-- Modal Demande de Retouche -->
  <div class="modal-backdrop" id="revision-modal" role="dialog" aria-modal="true" aria-labelledby="revision-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="revision-modal-title">Demander une retouche</h3>
        <button type="button" class="modal-close" id="revision-modal-close-btn" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form class="modal-body" id="form-revision">
        <div class="form-field">
          <label for="revision-comment">Vos remarques & consignes de modification *</label>
          <textarea id="revision-comment" placeholder="Ex: Veuillez modifier le prix à 25 000 FCFA, corriger le numéro WhatsApp, ou ajuster le visuel..." required style="min-height: 120px;"></textarea>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn-primary-app">
            <span>Envoyer la demande</span>
          </button>
          <button type="button" class="btn-secondary-app" id="revision-cancel-btn">
            Annuler
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Firebase SDK (CDN compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/backend.js"></script>
  <script>
    // Initialisation du portail client
    document.addEventListener('DOMContentLoaded', () => {
      initValidationPortal();
    });

    let currentRevisionPostId = null;

    function initValidationPortal() {
      const urlParams = new URLSearchParams(window.location.search);
      const clientId = urlParams.get('client');
      const token = urlParams.get('token');
      const ws = CMFlowStore.getWorkspace();
      const clients = CMFlowStore.getClients();

      const agencyLabel = document.getElementById('portal-agency-name');
      const clientTitle = document.getElementById('portal-client-title');

      if (agencyLabel && ws?.name) {
        agencyLabel.textContent = `Espace de validation • ${escapeHtml(ws.name)}`;
      }

      // 1. Vérification locale (si sur la même machine que le CM)
      let targetClient = null;
      if (clientId) {
        targetClient = clients.find(c => c.id === clientId);
      }

      let isTokenValid = true;
      if (token && typeof CMFlowSecurity !== 'undefined' && targetClient) {
        isTokenValid = CMFlowSecurity.verifyClientToken(targetClient, token);
      }

      if (targetClient && isTokenValid) {
        if (clientTitle) clientTitle.textContent = escapeHtml(targetClient.name);
        renderPortalPosts(targetClient.id);
      } else if (token && typeof cmfireDb !== 'undefined' && cmfireDb) {
        // 2. Vérification distante temps réel (client externe sur smartphone WhatsApp)
        cmfireDb.collection('public_reviews').doc(token).get().then(docSnap => {
          if (docSnap.exists) {
            const reviewData = docSnap.data();
            if (agencyLabel && reviewData.workspaceName) {
              agencyLabel.textContent = `Espace de validation • ${escapeHtml(reviewData.workspaceName)}`;
            }
            if (clientTitle && reviewData.clientName) {
              clientTitle.textContent = escapeHtml(reviewData.clientName);
            }
            renderPortalPostsFromData(reviewData.posts || [], token);
          } else {
            renderAccessDenied();
          }
        }).catch(err => {
          console.warn('Erreur chargement distant:', err);
          renderAccessDenied();
        });
      } else {
        if (clientTitle) clientTitle.textContent = 'Accès Restreint';
        renderAccessDenied();
        return;
      }

      // Modal de retouche
      const revModal = document.getElementById('revision-modal');
      const closeBtn = document.getElementById('revision-modal-close-btn');
      const cancelBtn = document.getElementById('revision-cancel-btn');
      const formRev = document.getElementById('form-revision');

      const closeRevModal = () => {
        revModal.classList.remove('active');
        document.body.style.overflow = '';
        currentRevisionPostId = null;
        if (formRev) formRev.reset();
      };

      if (closeBtn) closeBtn.addEventListener('click', closeRevModal);
      if (cancelBtn) cancelBtn.addEventListener('click', closeRevModal);

      if (formRev) {
        formRev.addEventListener('submit', (e) => {
          e.preventDefault();
          const commentRaw = document.getElementById('revision-comment')?.value.trim();
          if (!commentRaw || !currentRevisionPostId) return;

          const cleanComment = typeof CMFlowSecurity !== 'undefined'
            ? CMFlowSecurity.sanitizeInput(commentRaw)
            : commentRaw;

          CMFlowBackend.requestRevision(currentRevisionPostId, cleanComment);
          showAppToast('Votre demande de modification a été transmise à votre CM ! 📝', 'info');
          closeRevModal();
          renderPortalPosts(targetClient.id);
        });
      }

      // Écouter les mises à jour temps réel
      window.addEventListener('cmflow:post_updated', () => {
        renderPortalPosts(targetClient.id);
      });
    }

    function renderAccessDenied() {
      const container = document.getElementById('portal-posts-list');
      const statsGrid = document.querySelector('.portal-stats-grid');
      if (statsGrid) statsGrid.style.display = 'none';

      if (container) {
        container.innerHTML = `
          <div class="empty-state-card" style="background: white; border: 1.5px solid #fee2e2; padding: 48px 24px; text-align: center; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04);">
            <div style="width: 64px; height: 64px; border-radius: 50%; background: #fee2e2; color: #dc2626; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 16px;">
              🔒
            </div>
            <h3 style="font-size: 1.25rem; font-weight: 700; color: #991b1b; margin-bottom: 8px;">Lien de validation restreint ou expiré</h3>
            <p style="color: var(--text-muted); font-size: 0.95rem; max-width: 460px; margin: 0 auto 20px; line-height: 1.5;">
              Pour des raisons de confidentialité et de sécurité, vous ne pouvez pas accéder à ce portail sans un lien de partage sécurisé attribué par votre agence.
            </p>
            <div style="font-size: 0.82rem; color: var(--text-muted); background: var(--bg-surface-soft); display: inline-block; padding: 6px 14px; border-radius: 20px;">
              Contactez votre Community Manager pour recevoir un nouveau lien.
            </div>
          </div>
        `;
      }
    }

    function renderPortalPostsFromData(posts, token) {
      currentRemotePosts = posts;
      currentRemoteToken = token;
      const container = document.getElementById('portal-posts-list');

      const totalEl = document.getElementById('portal-stat-total');
      const approvedEl = document.getElementById('portal-stat-approved');
      const pendingEl = document.getElementById('portal-stat-pending');

      const approvedCount = posts.filter(p => p.status === 'scheduled' || p.status === 'published' || p.clientApproved).length;
      const pendingCount = posts.filter(p => p.status === 'pending' || !p.clientApproved).length;

      if (totalEl) totalEl.textContent = posts.length;
      if (approvedEl) approvedEl.textContent = approvedCount;
      if (pendingEl) pendingEl.textContent = pendingCount;

      if (!container) return;
      container.innerHTML = '';

      if (posts.length === 0) {
        container.innerHTML = `
          <div class="empty-state-card" style="background: white;">
            <div class="empty-state-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="32" height="32">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
              </svg>
            </div>
            <h3 class="empty-state-title">Aucune publication en attente</h3>
            <p class="empty-state-text">Toutes vos publications prévues sont à jour ou déjà validées.</p>
          </div>
        `;
        return;
      }

      posts.forEach(post => {
        const isApproved = post.clientApproved || post.status === 'scheduled' || post.status === 'published';
        const hasFeedback = post.clientFeedback && post.clientFeedback.length > 0;

        const card = document.createElement('div');
        card.className = 'portal-post-card';
        card.innerHTML = `
          <div class="portal-post-media">
            <img src="${typeof CMFlowSecurity !== 'undefined' ? CMFlowSecurity.sanitizeUrl(post.imageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=80') : (post.imageUrl || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=80')}" alt="Visuel prévu">
          </div>

          <div class="portal-post-content">
            <div>
              <div class="portal-post-header">
                <span class="portal-post-date-badge">
                  📅 ${post.scheduledDate ? CMFlowStore.formatDate(post.scheduledDate) : 'Date à définir'} à ${post.scheduledTime || '14:00'}
                </span>
                <span class="status-tag ${isApproved ? 'published' : 'pending'}">
                  ${isApproved ? '✅ Validé pour publication' : '⏳ En attente de validation'}
                </span>
              </div>

              <div style="margin: 12px 0 6px;">
                <span style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Légende & Hashtags :</span>
              </div>
              <div class="portal-post-text">${escapeHtml(post.caption || '')}</div>

              ${hasFeedback ? `
                <div class="portal-feedback-bubble" style="margin-top: 10px;">
                  <strong>Dernière remarque envoyée :</strong> ${escapeHtml(post.clientFeedback)}
                </div>
              ` : ''}
            </div>

            <div class="portal-post-actions">
              ${!isApproved ? `
                <button type="button" class="btn-approve-post" onclick="approvePostFromPortal('${post.id}')">
                  <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                  <span>Valider ce post</span>
                </button>
              ` : `
                <span style="font-size: 0.85rem; font-weight: 600; color: #059669; display: inline-flex; align-items: center; gap: 6px;">
                  ✓ Vous avez validé cette publication
                </span>
              `}

              <button type="button" class="btn-revision-post" onclick="openRevisionModal('${post.id}')">
                <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"/></svg>
                <span>Demander une retouche</span>
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    let currentRemotePosts = null;
    let currentRemoteToken = null;

    function renderPortalPosts(clientId) {
      const allPosts = CMFlowStore.getPosts();
      const posts = allPosts.filter(p => p.clientId === clientId);
      renderPortalPostsFromData(posts, null);
    }

    function approvePostFromPortal(postId) {
      if (currentRemoteToken && typeof cmfireDb !== 'undefined') {
        const post = (currentRemotePosts || []).find(p => p.id === postId);
        if (post) post.clientApproved = true;
        cmfireDb.collection('public_reviews').doc(currentRemoteToken).set({
          posts: currentRemotePosts,
          updatedAt: new Date().toISOString()
        }, { merge: true }).catch(console.warn);
      }
      CMFlowBackend.approvePost(postId);
      showAppToast('Publication validée avec succès ! 🎉', 'success');
      const urlParams = new URLSearchParams(window.location.search);
      const clientId = urlParams.get('client');
      if (clientId) renderPortalPosts(clientId);
      else if (currentRemotePosts) renderPortalPostsFromData(currentRemotePosts, currentRemoteToken);
    }

    function openRevisionModal(postId) {
      currentRevisionPostId = postId;
      const modal = document.getElementById('revision-modal');
      if (modal) {
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        setTimeout(() => {
          document.getElementById('revision-comment')?.focus();
        }, 150);
      }
    }
  </script>
</body>
</html>
